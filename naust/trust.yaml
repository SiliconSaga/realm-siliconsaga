# Who may call a pull request into a bay. Nothing runs unasked: a job starts
# when an operator runs `naust dock` at the keyboard, or when a login listed
# here reviews the PR with the phrase addressed to a naust's machine account,
# "@agent-refr haul it in". GitHub records the commit a review was given on,
# and that is the only commit the call admits; a push after it needs a new
# call. Approvals and labels are not read.
terasology:
  smidir:                                # smiðir, the smiths of the yard: login -> the machine account their own naust posts as
    Cervator: agent-refr                 # GooeyHub once it is wired; a login may call any listed naust in, not only its own
  nod_phrase: "haul it in"               # the boathouse hauls the boat in; matched anywhere in the review text, with the @account
