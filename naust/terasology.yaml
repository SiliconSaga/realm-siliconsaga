# naust profile for Terasology — what a PR job does for this component.
# Build, test and run commands are NOT here: they are the adapter's, and naust
# calls them through the bay's own ws. How the tree is provisioned and reset
# is the adapter's provision: block. This file adds only what neither says.
# Scripts referenced below live in ../terasology/ and run with the engine
# checkout as cwd and NAUST_* in the environment.
component: terasology
repo: MovingBlocks/Terasology           # the watched repository
# The name the reports and comments speak as. The GitHub author of a comment
# is whichever account NAUST_GITHUB_TOKEN belongs to: the machine account this
# naust posts as (agent-refr), never a person's own login.
persona: Gooey

bay:
  ready_ttl_days: 7                      # a finished job waits this long for a human

gradle:
  # The daemon's JVM, written to the shared Gradle home's gradle.properties by naust. Configuring the
  # full Omega set, ~144 subprojects, thrashes the 512 MiB default; the host has memory to spare.
  jvmargs: "-Xmx6g -XX:MaxMetaspaceSize=1g"

steps:
  compile_all: "./gradlew compileJava"      # unqualified on purpose: every module in the set
  headless: "bash \"$NAUST_REALM_DIR/terasology/pr-headless.sh\""
  launch: "NAUST_SETTLE_SECONDS=45 bash \"$NAUST_REALM_DIR/terasology/pr-launch.sh\""

hooks:
  after_add: "bash \"$NAUST_REALM_DIR/terasology/pr-seed.sh\" generate"
  # Seeded modules arrive without their generated build.gradle, and a deep reset drops it: put it back, then the seed save.
  after_reset: "bash \"$NAUST_REALM_DIR/terasology/pr-modules.sh\" ensure && bash \"$NAUST_REALM_DIR/terasology/pr-seed.sh\" restore"

report:
  comment: on                            # a job called in from GitHub reports back there (the owner's call: GDD may post in the
                                         # oss-wide register); a hand-docked job never does unless `naust dock --comment`
