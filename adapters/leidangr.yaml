# leidangr adapter — Backstage app (Yarn 4 via Corepack; no global yarn).
# Component cwd is components/leidangr/ when ws test / ws lint run.
#
# test: the test suites only — the DevEx envelope + BDD acceptance (jest-cucumber,
# `make test`) AND the app/plugin/backend unit tests (`make test-app`,
# backstage-cli; CI=true in the Makefile so it runs once instead of watching).
# lint: the static checks — repo ESLint across all workspaces (`make lint`) PLUS
# the whole-repo typecheck (`make tsc`), which catches wiring/import errors ESLint
# misses. (tsc is a static check, not a test, so it lives under lint.)
#
# The full local gate (config-check + lint + tsc + both test suites) remains
# `make ci`; run it via `ws exec leidangr make ci` until a dedicated `ws ci` verb
# lands. Adapter commands are whitespace-tokenized (no shell), so multi-target
# make invocations (`make test test-app`) work, but shell operators do not.
#
# run: the local dev server in stub mode — no secrets, no cluster. Long-lived
# and interactive by nature, which is why `ws run` stays behind a permission
# prompt rather than being pre-allowed. The Makefile target owns any environment
# fixing (notably resolving a real mkdocs binary for TechDocs), so `make dev`
# behaves identically whether launched through `ws run` or straight from a
# terminal. `make dev-gitea` is the secrets-backed variant, still run directly.
commands:
  test: "make test test-app"
  # testFilter: how to run ONE thing. `make test test-app` has no filter syntax
  # for ws to infer, so it is declared here and `{}` marks where the selector
  # goes. Straight to backstage-cli rather than through make, because the make
  # targets are deliberately whole-suite and a `test-one` target would be a
  # second way to invoke the same runner.
  #
  # Covers the unit suites (packages/*, plugins/*) only — the envelope and BDD
  # specs under scripts/ and tests/ run through `make test` and its own jest
  # config. `--watch=false` because backstage-cli otherwise watches in a TTY and
  # never exits, which is the same reason the Makefile sets CI=true.
  testFilter: "corepack yarn backstage-cli repo test {} --watch=false"
  lint: "make lint tsc"
  run: "make dev"

ai_context:
  - path: "README.md"
    description: "Backstage app overview"
  - path: "Makefile"
    description: "DevEx envelope targets (doctor/deps/dev/test/secrets/ci)"
