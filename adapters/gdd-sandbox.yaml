# gdd-sandbox adapter — build/test commands and AI context pointers
commands:
  # Portable bash runner (no `make`; this host has no bats/shellcheck on PATH).
  # test: workspace-vendored bats over tests/. lint: shellcheck via container.
  test: "bash tests/run.sh test"
  # `ws test gdd-sandbox <selector>` — a path under tests/ runs that file, anything
  # else is a bats --filter regex over test names; a regex matching nothing fails
  # rather than passing as an empty green run. Needs gdd-sandbox#9's run.sh.
  testFilter: "bash tests/run.sh test {}"
  lint: "bash tests/run.sh lint"
  # Building the image is this component's real build step — it is what turns the
  # scripts into something runnable. Declared here so it is discoverable via
  # `ws actions` and works the moment a build verb exists, rather than living only
  # in a README as a command people copy by hand.
  build: "bash bin/build.sh"

ai_context:
  - path: "AGENTS.md"
    description: "Agent guidelines for operating a gdd-sandbox"
  - path: "docs/"
    description: "Design and implementation plans"
