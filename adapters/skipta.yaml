# skipta adapter — build/test commands and AI context pointers
commands:
  test: "make test"
  lint: "make lint"
  # Through make, not the venv path directly: the Makefile resolves
  # .venv/Scripts/python.exe on Windows and .venv/bin/python elsewhere.
  format: "make format"

ai_context:
  - path: "README.md"
    description: "Service overview, local dev, deploy"
