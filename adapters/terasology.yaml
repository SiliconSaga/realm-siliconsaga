# terasology adapter — build/test commands and AI context pointers
#
# Two rules shape every command here.
#
# 1. Task names match Jenkins, not Gradle defaults, so a local run and a CI
#    stage answer the same question. `unitTest` is the stage CI gates on; it
#    excludes the MteTest and TteTest tags (1m timeout) that the conventional
#    `test` task pulls in at a 4m timeout. The slow ones are their own Jenkins
#    stages (integrationTest, integrationTestFlaky) and are run deliberately.
#
# 2. Every task is qualified to a subproject. Unqualified (`test`, `clean`)
#    matches across the whole multi-project build, which in an Omega workspace
#    means all ~144 module subprojects: slow, and a broad red result usually
#    means "the module set is too big", not "the change is broken".
#    `ws test terasology <ClassName>` resolves the class on disk and scopes to
#    its owning subproject; the qualification here fixes the bare form.
#
# CAVEAT: `build-logic/src/main/kotlin/terasology-metrics.gradle.kts` sets
# `ignoreFailures = true` for every Test task, so `ws test terasology` exits 0
# whatever the tests did. That is deliberate upstream — Jenkins reads the
# reports and marks findings UNSTABLE rather than FAILED — and the cost lands
# locally, where nothing reads the reports. The verdict is
# `engine-tests/build/test-results/unitTest/TEST-*.xml`, not the exit code.
#
# `lint` is half-affected: Checkstyle sets `isIgnoreFailures = false` and does
# fail the command; PMD and SpotBugs report only. Green means "no Checkstyle
# violations", not "clean".
commands:
  build: "./gradlew :facades:PC:build"
  test: "./gradlew :engine-tests:unitTest"
  lint: "./gradlew :engine:check -x test"
  run: "./gradlew :facades:PC:run"
  clean: "./gradlew :engine:clean :engine-tests:clean :facades:PC:clean"

# Terasology is a workspace in its own right: modules and libraries are independent
# repos meant to sit inside the engine tree, where the gradle harness can build them.
# Declaring the shape rather than the contents keeps this stable while ~144 modules churn.
nested:
  - "modules/*"
  - "libs/*"

ai_context:
  - path: "docs/Engine-Testing-Patterns.md"
    description: "Engine test patterns: MTE, network events, context isolation, Gradle execution"
  - path: "docs/Codebase-Structure.md"
    description: "Repo layout: engine, facades, modules, libs"
  - path: "docs/Contributor-Quick-Start.md"
    description: "Clone, fetch modules, first run; the only doc stating the Java version correctly"
