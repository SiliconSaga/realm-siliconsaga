# terasology adapter — build/test commands and AI context pointers
#
# Every command here is scoped to a subproject on purpose. Task names
# left unqualified (`test`, `checkstyleMain`, `clean`) match across the
# whole multi-project build, which in an Omega workspace means all ~144
# module subprojects. That sweep is slow, and a broad red result from
# it usually means "the module set is too big", not "the change is
# broken". `ws test terasology <ClassName>` still resolves a class on
# disk and scopes to its owning subproject; this only fixes the bare
# form.
#
# Only `test` and `lint` are executed by a ws verb (ws-test.sh and
# ws-lint.sh read them). `build`, `run` and `clean` are documentation
# for now — but every value here is hashed into the realm trust
# fingerprint and printed in the trust summary, so an unscoped one is
# still a footgun someone can copy.
commands:
  build: "./gradlew :facades:PC:build"
  test: "./gradlew :engine-tests:test"
  lint: "./gradlew :engine:checkstyleMain :engine:pmdMain"
  run: "./gradlew :facades:PC:run"
  clean: "./gradlew :engine:clean :engine-tests:clean :facades:PC:clean"

# Terasology is a workspace in its own right: modules and libraries are independent
# repos meant to sit inside the engine tree, where the gradle harness can build them.
# Declaring the shape rather than the contents keeps this stable while ~144 modules churn.
nested:
  - "modules/*"
  - "libs/*"

ai_context:
  - path: "docs/Engine-Testing-Patterns.md"
    description: "Engine test patterns: MTE, network events, context isolation, Gradle execution"
  - path: "docs/Codebase-Structure.md"
    description: "Repo layout: engine, facades, modules, libs"
  - path: "docs/Contributor-Quick-Start.md"
    description: "Clone, fetch modules, first run; the only doc stating the Java version correctly"
